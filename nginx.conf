server {
    listen 80;
    server_name vocaloop.lawdigest.kr;

    # HTTP to HTTPS redirection
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name vocaloop.lawdigest.kr;

    # AI 탭 파일 가져오기(최대 100MB)와 5MB 프로필 이미지. 기본값 1m 이면 nginx 가 413 으로 먼저 거절한다.
    client_max_body_size 100m;

    # SSL configuration (인증서 경로를 실제 경로로 변경하세요)
    # ssl_certificate /etc/letsencrypt/live/vocaloop.lawdigest.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vocaloop.lawdigest.kr/privkey.pem;
    
    # SSL parameters (권장 설정)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3050;
        # /api/ai/codex 는 Codex CLI 완료까지 최대 180s(CODEX_CLI_TIMEOUT_SECONDS) 기다린다. 기본값 60s 면 끊긴다.
        proxy_read_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 클라이언트 실제 IP 전달
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
